services:
  - type: web
    name: hashmi-md
    env: node
    plan: free
    buildCommand: bash setup.sh
    startCommand: node silva.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BOT_NAME
        value: "HASHMI-MD"
      - key: OWNER_NAME
        value: "Abrar Hashmi"
      - key: OWNER_NUMBER
        value: "923440167840"
      - key: MODE
        value: "public"
      - key: PREFIX
        value: "."
      - key: SESSION_ID
        sync: false
